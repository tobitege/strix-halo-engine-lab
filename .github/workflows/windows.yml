name: Windows

# Native Windows build of the Qwen single-node engine (docs/getting-started/windows.md) and the host tests of
# the code that build touches. Hosted runners have no AMD GPU: nothing here runs a kernel or loads a model, and
# tests labelled gpu are left out.

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ROCM_VERSION: 7.14.1
  ROCM_DEVICE: gfx1151
  # A short folder: `rocm-sdk init` links device files by paths that must stay below 260 characters.
  ROCM_VENV: C:\rocm
  # Built and run below. Each of them passes on a Windows Strix Halo machine; the Linux-only tests are not listed.
  # None of them imports the HIP runtime DLL (see STRIX_WINDOWS_HIP_PROGRAMS).
  STRIX_WINDOWS_TESTS: >-
    strix-process-restart-tests
    strix-process-environment-tests
    strix-host-memory-tests
    strix-mapped-model-file-tests
    strix-model-content-hash-tests
    strix-model-selective-copy-layout-tests
    strix-qsa-score-scratch-tests
    strix-qwen-pair-transport-unavailable-tests
    strix-dist-crc32c-tests
    strix-qwen-startup-policy-tests
    strix-qwen-effective-config-tests
    strix-qpf2k-defaults-tests
    strix-qwen-product-profile-tests
    strix-qwen-allon-tests
    strix-env-flags-tests
    strix-engine-profile-common-tests
    strix-ds41-session-cache-tests
  # Built, and only started under a time limit: these programs import amdhip64_7.dll. On the first run of this
  # workflow the one test among them did not return within 25 minutes on a runner without an AMD GPU.
  STRIX_WINDOWS_HIP_PROGRAMS: >-
    strix-deploy-tests
    strix-hip-decode-token

jobs:
  windows-hip-build:
    # The build needs the MSVC 14.4x toolset (the C++ library of 14.5x does not compile with this SDK's HIP
    # headers). This label serves images with Visual Studio 2022 or with Visual Studio 2026 and its 14.44
    # component; scripts/windows/build-hip.bat selects the toolset on either.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - name: Restore the ROCm SDK
        id: rocm-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ROCM_VENV }}
          key: rocm-sdk-windows-${{ env.ROCM_VERSION }}-${{ env.ROCM_DEVICE }}-py${{ steps.python.outputs.python-version }}

      - name: Install the ROCm SDK
        if: steps.rocm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv $env:ROCM_VENV
          & "$env:ROCM_VENV\Scripts\python.exe" -m pip install --disable-pip-version-check `
            --index-url https://repo.amd.com/rocm/whl-multi-arch/ `
            "rocm[libraries,devel,device-$env:ROCM_DEVICE]==$env:ROCM_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Unpack the ROCm SDK
        shell: pwsh
        run: |
          # The first init unpacks the compiler, headers and libraries; with a restored folder it only checks.
          & "$env:ROCM_VENV\Scripts\rocm-sdk.exe" init
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = "$env:ROCM_VENV\Lib\site-packages\_rocm_sdk_devel"
          if (-not (Test-Path "$sdk\lib\llvm\bin\clang++.exe")) { throw "no clang++ under $sdk" }
          "ROCM_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the engine and the tests
        shell: pwsh
        env:
          STRIX_BUILD_DIR: ${{ github.workspace }}\build-hip
          STRIX_EXTRA_CMAKE: -DBUILD_TESTING=ON
        run: |
          $targets = "$env:STRIX_WINDOWS_TESTS $env:STRIX_WINDOWS_HIP_PROGRAMS" -split '\s+' | Where-Object { $_ }
          & scripts\windows\build-hip.bat all @targets 2>&1 | Tee-Object -FilePath windows-hip-build.log
          exit $LASTEXITCODE

      - name: Run the tests
        shell: pwsh
        run: |
          $tests = $env:STRIX_WINDOWS_TESTS -split '\s+' | Where-Object { $_ }
          ctest --test-dir build-hip -R ("^(" + ($tests -join '|') + ")$") --output-on-failure --no-tests=error --timeout 300
          exit $LASTEXITCODE

      - name: Start the programs that import the HIP runtime
        # Informative, never fails the job: it records how the HIP runtime behaves on a runner without an AMD GPU.
        # Each program gets 120 seconds (the engine only prints its usage); one that does not return is ended.
        continue-on-error: true
        shell: pwsh
        run: |
          $stalled = 0
          foreach ($program in ($env:STRIX_WINDOWS_HIP_PROGRAMS -split '\s+' | Where-Object { $_ })) {
            $start = @{ FilePath = "build-hip\$program.exe"; PassThru = $true; NoNewWindow = $true; RedirectStandardOutput = "$program.out" }
            if ($program -eq 'strix-hip-decode-token') { $start.ArgumentList = '--help' }
            $process = Start-Process @start
            $null = $process.Handle   # keeps the exit code readable after the process ends
            if ($process.WaitForExit(120000)) { "${program}: exit code $($process.ExitCode)" }
            else { $process.Kill($true); $stalled++; "${program}: did not return within 120 s and was ended" }
          }
          if ($stalled) { throw "$stalled of the programs that import the HIP runtime did not return on this runner" }

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-hip-build-log
          path: windows-hip-build.log
          if-no-files-found: ignore
