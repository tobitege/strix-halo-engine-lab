# Model registry: one row per model with a description file. Registering descriptive metadata for an
# already supported compiled contract takes models/<name>.toml and one [models.<id>] table below.
# These files do not add inference support for a new size or checkpoint contract; a changed contract
# still requires family adapter/engine work and qualification. The shared serve shell reads it for
# selection, without changing defaults. tests/model_registry_tests.cpp checks names, that every listed file
# exists and that every models/*.toml has a row; it does not prove support.
schema = "strix-registry/v1"

[models.qwen3_8_flash_next]
name = "qwen3.8-flash-next"
description = "models/qwen3.8-flash-next.toml"
family = "qwen"
cmake = ""
profile_tag = "qwen"
allow_pending_env = "STRIX_QWEN_PROFILE_ALLOW_PENDING"
defaults = ["include/strix/qwen_profile_table.hpp", "include/strix/qpf2k_defaults.hpp"]
apps = ["apps/hip_decode_token_main.cpp"]
adapter = ["include/strix/qwen_model_description.hpp"]

[models.deepseek_v4_1_flash]
name = "deepseek-v4.1-flash"
description = "models/deepseek-v4.1-flash.toml"
family = "deepseek41"
cmake = "STRIX_FAMILY_DEEPSEEK41"
profile_tag = "deepseek41-pair"
allow_pending_env = "STRIX_DS41_PROFILE_ALLOW_PENDING"
defaults = ["src/deepseek41_pair_defaults.cpp", "src/ds41_rtx_profile.cpp"]
apps = ["apps/deepseek41_rank_main.cpp", "apps/deepseek41_serve_main.cpp"]
adapter = ["include/strix/deepseek41_model_description.hpp"]

[models.glm_5_3_flash]
name = "glm-5.3-flash"
description = "models/glm-5.3-flash.toml"
family = "glm5"
cmake = "STRIX_FAMILY_GLM5"
profile_tag = "glm-pair"
allow_pending_env = ""
defaults = ["apps/glm_rank_defaults.hpp"]
apps = ["apps/glm_rank_main.cpp", "apps/glm_serve_main.cpp"]
adapter = ["src/glm/load/glm_model_description.hpp"]

[models.minimax_m3_1_flash]
name = "minimax-m3.1-flash"
description = "models/minimax-m3.1-flash.toml"
family = "minimax"
cmake = "STRIX_FAMILY_MINIMAX"
profile_tag = "minimax-pair"
allow_pending_env = ""
defaults = ["src/minimax/engine/mm_defaults.cpp", "src/minimax/engine/mm_defaults.hpp"]
apps = ["apps/minimax_rank_main.cpp", "apps/minimax_serve_main.cpp"]
adapter = ["include/strix/minimax/model_description.hpp"]

[models.nemotron_3_5_bolt_e4b]
name = "nemotron-3.5-bolt-e4b"
description = "models/nemotron-3.5-bolt-e4b.toml"
family = "gemma4"
cmake = "STRIX_FAMILY_GEMMA4"
profile_tag = "gemma4"
allow_pending_env = "STRIX_G4_PROFILE_ALLOW_PENDING"
defaults = ["src/gemma4/engine/profile.cpp", "include/strix/profiles/gemma4.hpp"]
apps = ["apps/gemma4_decode_main.cpp", "apps/gemma4_serve_main.cpp"]
adapter = ["src/gemma4/model/description.hpp"]
